# GENIE slim: mc_syst/v9 (full AR23+ knobs, MvA ZExp, per-knob multisigma)
input_dir: /exp/sbnd/data/users/brindenc/analyze_sbnd/numu/v10_06_00_validation/pandora/mc_syst/v8
output_dir: /pnfs/sbnd/scratch/users/brindenc/analyze_sbnd/numu/v10_06_00_validation/pandora/mc_syst/v9

jobs:
  - name: slimsyst_nocuts_norecomb
    enabled: true
    description: INCLUDE_WEIGHTS=True, SLIM=True, UPDATE_RECOMB=False, ADD_STAT_UNC=True
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - makedf.makedf.make_mcnudf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
    names: [hdr, mcnu, evt_pand]
    input_list: mc_fullpand.list
    output: mcbnb_largepand_slimsyst_nocuts_norecomb
    settings:
      INCLUDE_WEIGHTS: true
      SLIM: true
      UPDATE_RECOMB: false
      VERBOSE: false
      ADD_STAT_UNC: true
    args:
      ngrid: 3500
      ncpu: -1
      nfile: -1
      memory: 6