jobs:

  # DEV
  - name: dataonbeam_nocuts
    enabled: true
    description: INCLUDE_WEIGHTS=False, SLIM=False, UPDATE_RECOMB=False
    base_config: analysis_village.numuincl.configs.base
    dfs:
      - makedf.makedf.make_hdrdf
      - makedf.makedf.make_mcnudf
      - analysis_village.numuincl.makedf1muX.make_pandora_evtdf_processed
      - analysis_village.numuincl.makedf1muX.make_custom_trkdf
    names: [hdr, mcnu, evt_pand, trk]
    output: dataonbeam_dev
    input_list: data_devsample.list 
    settings:
      INCLUDE_WEIGHTS: false
      SLIM: false
      UPDATE_RECOMB: false
      VERBOSE: true
    args:
      ngrid: 100
      ncpu: -1
      nfile: -1

